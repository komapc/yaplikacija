<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0c10" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found — Аппликация Ы</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0c10;
        color: #eef2f6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main { max-width: 560px; padding: 40px 20px; }
      .glyph { font-size: 96px; font-weight: 800; color: #2fe39b; line-height: 1; }
      h1 { font-size: 24px; margin: 18px 0 6px; }
      p { color: #8a93a4; margin: 6px 0; }
      ul { list-style: none; padding: 0; margin: 22px 0 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; }
      a { color: #2fe39b; }
    </style>
  </head>
  <body>
    <main>
      <div class="glyph" aria-hidden="true">Ы?</div>
      <h1>Page not found</h1>
      <p>This page does not exist. The pronunciation trainer is one click away.</p>
      <p lang="ru">Такой страницы нет.</p>
      <p lang="he" dir="rtl">הדף לא נמצא.</p>
      <p lang="ar" dir="rtl">الصفحة غير موجودة.</p>
      <ul>
        <li><a href="/" hreflang="en">English</a></li>
        <li><a href="/ru/" hreflang="ru" lang="ru">Русский</a></li>
        <li><a href="/he/" hreflang="he" lang="he">עברית</a></li>
        <li><a href="/ar/" hreflang="ar" lang="ar">العربية</a></li>
      </ul>
    </main>
  </body>
</html>
